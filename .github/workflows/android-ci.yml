name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and validate Android app
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant wrapper permissions
        run: chmod +x ./gradlew

      - name: Run JVM unit tests
        run: ./gradlew test

      - name: Run Android lint
        run: ./gradlew lint

      - name: Assemble debug APK
        run: ./gradlew assembleDebug
